# Windows CI: unsigned MSI.
# Tags ship signed artifacts via release-windows.yml.
name: ci-windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: msi (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS deps
        run: |
          npm ci
          npm --prefix app ci

      - name: Bundle MSI
        run: npx tauri build -b msi

      - name: Check MSI
        shell: bash
        run: ls -lh src-tauri/target/release/bundle/msi/*.msi
