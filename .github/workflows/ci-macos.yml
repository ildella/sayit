# Compile the Tauri shell on macOS. On demand only — Linux is the CI default,
# and the macOS voice is Calle's original app. Bind --no-bundle: installers are
# not shipped from here.
name: ci-macos

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (macos-latest)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS deps
        run: |
          npm ci
          npm --prefix app ci

      - name: Compile shell (no bundle)
        run: npm run build:ci

      - name: Check release binary
        run: test -f src-tauri/target/release/sayit-desktop
