# Compile the Tauri shell on Linux, macOS, and Windows.
# Intentionally --no-bundle: installers would be a mute window until the
# Node sidecar is packaged. This job only proves the crate + UI build.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS deps
        run: |
          npm ci
          npm --prefix app ci

      - name: Compile shell (no bundle)
        run: npm run build:ci

      - name: Check release binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f src-tauri/target/release/sayit.exe
          else
            test -f src-tauri/target/release/sayit
          fi
