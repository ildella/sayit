# Build Linux GUI packages with the Node sidecar inside.
# PR CI stays unsigned; this job is tags (and manual dispatch) only.
# AppImage is the auto-update channel (signed). deb/rpm stay distro packages.
name: release-linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  linux:
    name: deb + rpm + appimage (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux WebKitGTK + rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            sidecar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS deps
        run: |
          npm ci
          npm --prefix app ci

      - name: Bundle deb, rpm, and signed AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npx tauri build -b deb,rpm,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Write latest.json
        run: sh scripts/write-latest-json.sh "${{ github.ref_name }}" "${{ github.repository }}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            latest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig \
            latest.json \
            --generate-notes --verify-tag \
          || gh release upload "${{ github.ref_name }}" \
               src-tauri/target/release/bundle/deb/*.deb \
               src-tauri/target/release/bundle/rpm/*.rpm \
               src-tauri/target/release/bundle/appimage/*.AppImage \
               src-tauri/target/release/bundle/appimage/*.AppImage.sig \
               latest.json \
               --clobber
