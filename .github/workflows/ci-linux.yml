# Compile the Tauri shell on Linux.
# PRs stay --no-bundle (fast). Linux installers are `.github/workflows/release-linux.yml`.
name: ci-linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux WebKitGTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS deps
        run: |
          npm ci
          npm --prefix app ci

      - name: Compile shell (no bundle)
        run: npm run build:ci

      - name: Check release binary
        run: test -f src-tauri/target/release/sayit-desktop
