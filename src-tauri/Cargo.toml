[package]
name = "sayit"
version = "0.2.4"
description = "Private, local text-to-speech for Linux"
license = "MIT"
edition = "2021"
build = "build.rs"          # ← add this

[build-dependencies]        # ← add this section
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "config-json5"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
dirs = "6"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
